version: '3.8'

services:
  postgres:
    build: .
    container_name: pos-postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_TEST_DB=${POSTGRES_TEST_DB}
      - POSTGRES_TEST_USER=${POSTGRES_TEST_USER}
      - POSTGRES_TEST_PASSWORD=${POSTGRES_TEST_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
    # Le dice a Compose que el volumen ya existe y no debe crearlo de nuevo
    external: true
